<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Barcode test sheet</title>
<style>
body{font:13px sans-serif;margin:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cell{border:1px solid #999;padding:6px;break-inside:avoid;text-align:center}
.cell.invalid{border-color:#c00;background:#fff5f5}
.meta{color:#444;font-size:11px}.note{color:#c00;font-size:11px}
@media print{.cell{border-color:#000}}
</style></head><body>
<h1>Barcode test sheet</h1><p id="status"></p><div id="grid"></div>
<script src="barcode-render.js"></script>
<script>
(function () {
  var grid = document.getElementById('grid'), status = document.getElementById('status');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  fetch('../test/fixtures/be-products.json').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (rows) {
    if (!Array.isArray(rows)) rows = rows.rows || rows.products || [];
    status.textContent = rows.length + ' entries';
    rows.forEach(function (p) {
      var svg, note = '';
      try { svg = BarcodeRender.toSVG(p.ean, p.symbology, { moduleWidth: 2, height: 70 }); }
      catch (e) { note = 'Not encodable: ' + e.message; }
      if (p.expectValid === false) note = (note ? note + '; ' : '') + 'expected invalid' + (svg ? ' (drawn anyway)' : '');
      var d = document.createElement('div');
      d.className = 'cell' + (p.expectValid === false ? ' invalid' : '');
      d.innerHTML = '<strong>' + esc(p.label) + '</strong><div class="meta">' + esc(p.store) + (p.privateLabel ? ' (private label)' : '') +
        (p.group ? ' · ' + esc(p.group) : '') + (p.kind ? ' · ' + esc(p.kind) : '') + '</div>' + (svg || '') +
        '<div class="meta">' + esc(p.ean) + ' · ' + esc(p.symbology) + '</div>' + (note ? '<div class="note">' + esc(note) + '</div>' : '');
      grid.appendChild(d);
    });
  }).catch(function (e) {
    status.textContent = 'Could not load test/fixtures/be-products.json (' + e.message + '). Serve from repo root: python3 -m http.server';
  });
})();
</script></body></html>
