name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: node test.js

      - name: Assemble site
        run: |
          mkdir -p _site/vendor
          cp index.html app.js lib.js sync.js style.css manifest.webmanifest sw.js _site/
          cp icon-180.png icon-192.png icon-512.png _site/
          cp vendor/ZXING-LICENSE vendor/zxing-library.min.js _site/vendor/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
